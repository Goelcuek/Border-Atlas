<title>Border Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: map-first app shell. A dense control sidebar on the left (stacked below the map on phones), the canvas map filling the rest, with a docked detail panel for the clicked country. Palette borrows from printed political atlases. */
:root{
  --bg:#f4f6f7; --panel:#ffffff; --ink:#1b232b; --muted:#5f6b75; --faint:#8a949c; --line:#dde2e6; --line2:#eef1f3;
  --ocean:#dbe5ec; --grat:#c9d6df; --border:#ffffff; --nodata:#cfd4d8; --halo:rgba(255,255,255,.85); --label:#1b232b;
  --accent:#1c4f9c; --accent-ink:#ffffff;
  --c-free:#2f7d5b; --c-eta:#8db36b; --c-voa:#e1b54a; --c-evisa:#d6803f; --c-req:#b4473b; --c-no:#3f2f3d; --c-self:#1c4f9c;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101519; --panel:#151b20; --ink:#e3e8ec; --muted:#97a2ab; --faint:#6d7881; --line:#25303a; --line2:#1c242b;
  --ocean:#0c1820; --grat:#16262f; --border:#0c1820; --nodata:#2a333b; --halo:rgba(12,24,32,.85); --label:#e3e8ec;
  --accent:#7aa5e8; --accent-ink:#0c1520;
  --c-free:#3f9a72; --c-eta:#9cc27a; --c-voa:#e3bc58; --c-evisa:#df8d4d; --c-req:#cf5a4d; --c-no:#7d6478; --c-self:#7aa5e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101519; --panel:#151b20; --ink:#e3e8ec; --muted:#97a2ab; --faint:#6d7881; --line:#25303a; --line2:#1c242b;
  --ocean:#0c1820; --grat:#16262f; --border:#0c1820; --nodata:#2a333b; --halo:rgba(12,24,32,.85); --label:#e3e8ec;
  --accent:#7aa5e8; --accent-ink:#0c1520;
  --c-free:#3f9a72; --c-eta:#9cc27a; --c-voa:#e3bc58; --c-evisa:#df8d4d; --c-req:#cf5a4d; --c-no:#7d6478; --c-self:#7aa5e8; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.iso{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);padding:0 4px;border-radius:2px;line-height:16px;display:inline-block;min-width:34px;text-align:center}

.app{display:grid;grid-template-columns:392px minmax(0,1fr);height:100%}
/* Sidebar */
#side{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;min-width:0;
  padding-left:env(safe-area-inset-left,0px)}
.sec{padding:16px 20px;border-bottom:1px solid var(--line)}
.sec h2{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.head{position:sticky;top:0;background:var(--panel);z-index:5;padding-block:14px 14px}
.wordmark{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.wordmark b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.wordmark span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

.picker{position:relative}
.picker input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:9px 34px 9px 54px;font-size:15px;font-weight:600}
.picker .code{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.picker .chev{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.picker ul{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:min(56vh,380px);overflow:auto;margin:0;padding:4px 0;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:30}
.picker li{display:flex;gap:10px;align-items:center;padding:6px 10px;cursor:pointer;font-size:14px}
.picker li[aria-selected="true"],.picker li:hover{background:var(--line2)}
.picker li small{margin-left:auto;color:var(--faint);font-size:12px}

.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.title{font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.15;margin:0 0 4px;text-wrap:balance}
.lede{margin:0;color:var(--muted);font-size:13.5px}
.figs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line2)}
.figs div{padding-top:10px}
.figs div+div{padding-left:12px;border-left:1px solid var(--line2)}
.figs b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.figs span{font-size:11.5px;color:var(--muted)}

.bar{display:flex;height:8px;background:var(--line2);margin:2px 0 12px}
.bar span{height:100%}
.leg{display:grid;gap:1px;margin:0;padding:0;list-style:none}
.leg button{display:grid;grid-template-columns:12px 1fr 34px 40px;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:5px 6px;margin:0 -6px;width:calc(100% + 12px);cursor:pointer;text-align:left;border-radius:2px;font-size:13.5px}
.leg button:hover{background:var(--line2)}
.leg button[aria-pressed="true"]{background:var(--line2);font-weight:600}
.leg.filtering button[aria-pressed="false"]{color:var(--faint)}
.leg i{width:12px;height:12px;display:block}
.leg .n{text-align:right;font-variant-numeric:tabular-nums}
.leg .p{text-align:right;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12.5px}
.note{font-size:12px;color:var(--faint);margin:8px 0 0}

table.reg{width:100%;border-collapse:collapse;font-size:13px}
table.reg td{padding:4px 0}
table.reg td:first-child{width:76px}
table.reg td:last-child{width:54px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
table.reg .bar{margin:0;height:7px}

.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:var(--headH,0px);background:var(--panel);z-index:4}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.filter{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:7px 10px;margin-bottom:6px}
.grp h3{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.grp h3 i{width:10px;height:10px}
.grp h3 span{margin-left:auto;font-variant-numeric:tabular-nums}
.rows{display:grid}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;border:0;background:transparent;padding:5px 6px;margin:0 -6px;cursor:pointer;text-align:left;border-radius:2px;min-width:0;font-size:13.5px}
.row:hover,.row.on{background:var(--line2)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;white-space:nowrap}
.empty{color:var(--muted);padding:10px 0}

dl.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:0 0 4px;font-size:13.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:500;min-width:0}
.rules{margin:12px 0 0}
.rules div{padding:10px 0;border-top:1px solid var(--line2)}
.rules dt{font-weight:600;font-size:13.5px;margin-bottom:2px}
.rules dd{margin:0;font-size:13.5px;color:var(--ink);opacity:.9}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.tags span{font-size:11.5px;border:1px solid var(--line);padding:1px 6px;border-radius:2px;color:var(--muted)}
.src{display:inline-flex;align-items:center;gap:6px;margin-top:12px;color:var(--accent);font-weight:600;text-decoration:none;font-size:13.5px}
.src:hover{text-decoration:underline}
.generic{font-size:12.5px;color:var(--faint);margin:8px 0 0}

.foot{padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--faint);display:grid;gap:6px;margin-top:auto}
.foot a{color:var(--muted)}

/* Map */
#mapwrap{position:relative;min-width:0;background:var(--ocean);overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
#map.hot{cursor:pointer}
.mtitle{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:64px;pointer-events:none;font-size:13px;color:var(--ink)}
.mtitle span{background:var(--panel);border:1px solid var(--line);padding:5px 9px;border-radius:2px;display:inline-block;max-width:100%}
.zoom{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));display:grid;border:1px solid var(--line);background:var(--panel);border-radius:3px;overflow:hidden}
.zoom button{width:34px;height:34px;border:0;background:transparent;cursor:pointer;font-size:17px;line-height:1;color:var(--ink)}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--line2)}
.zoom button:disabled{color:var(--faint);cursor:default}
.scale{position:absolute;left:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:10.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:2px 6px;border-radius:2px;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:7px 9px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);border-radius:2px;max-width:240px;z-index:6}
.tip b{display:block;font-size:13.5px}
.tip .k{display:flex;gap:6px;align-items:center;margin-top:3px}
.tip .k i{width:9px;height:9px;display:block}
.tip small{color:var(--muted);display:block}

#detail{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(58px + env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.16);z-index:8;overscroll-behavior:contain}
#detail .dh{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--panel)}
#detail .dh h3{margin:0;font-size:17px;font-weight:700;line-height:1.2}
#detail .dh small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#detail .x{margin-left:auto;border:1px solid var(--line);background:var(--panel);width:30px;height:30px;border-radius:3px;cursor:pointer;flex:none;font-size:16px;line-height:1}
#detail .db{padding:12px 16px 16px}
.verdict{display:flex;gap:12px;align-items:center;padding:10px 0 12px}
.verdict i{width:30px;height:30px;flex:none;display:block}
.verdict b{display:block;font-size:16px;line-height:1.2}
.verdict span{font-size:12.5px;color:var(--muted)}
.dsub{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.back{display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap}
.back i{width:10px;height:10px;display:block}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:7px 10px;cursor:pointer;font-weight:500;font-size:13px;margin-top:14px}
.btn:hover{background:var(--line2)}
.scrim{display:none}

@media (max-width:900px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100%}
  #mapwrap{order:-1;height:58vh;min-height:320px;flex:none}
  #side{border-right:0;overflow:visible;padding-right:env(safe-area-inset-right,0px)}
  .head{position:static}
  .tabs{top:0}
  .sec{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #detail{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:72vh;border-radius:10px 10px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:7}
  .scrim[hidden]{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside id="side">
    <div class="sec head" id="head">
      <div class="wordmark"><b>Border Atlas</b><span>199 passports · ISO 3166</span></div>
      <div class="picker">
        <span class="iso code" id="pickCode">TUR</span>
        <input id="pickIn" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-label="Choose a country" aria-expanded="false" aria-controls="pickList">
        <svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5l3.5 3.5 3.5-3.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <ul id="pickList" role="listbox" hidden></ul>
      </div>
      <div class="seg" role="group" aria-label="Direction">
        <button id="modeOut" aria-pressed="true">Travelling from here</button>
        <button id="modeIn" aria-pressed="false">Travelling to here</button>
      </div>
    </div>
    <div class="sec" id="summary"></div>
    <div class="sec" id="legendSec"></div>
    <div class="sec" id="regionSec"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabList" aria-selected="true">Destinations</button>
      <button role="tab" id="tabEntry" aria-selected="false">Entry rules</button>
    </div>
    <div class="sec" id="panel" style="border-bottom:0"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <div id="mapwrap">
    <canvas id="map" aria-label="World map coloured by visa requirement"></canvas>
    <div class="mtitle" id="mtitle"></div>
    <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zReset" aria-label="Reset view" style="font-size:13px">⌂</button></div>
    <div class="scale" id="scale">1×</div>
    <div class="tip" id="tip" hidden></div>
    <div class="scrim" id="scrim" hidden></div>
    <section id="detail" hidden aria-live="polite"></section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>/*DATA*/</script>
<script>window.WORLD=/*WORLD*/;</script>
<script>
(function(){
const V=window.VISA, CODES=V.codes, IDX={}; CODES.forEach((c,i)=>IDX[c]=i);
const META={}; V.countries.forEach(c=>META[c.c]=c);
const N=CODES.length;
const CAT={
  F:{label:'Visa-free',color:'--c-free',desc:'No visa needed. Show your passport at the border.'},
  T:{label:'Travel authorisation',color:'--c-eta',desc:'No visa, but an online authorisation (ETA, ESTA, eTA) must be approved before you board.'},
  A:{label:'Visa on arrival',color:'--c-voa',desc:'Visa issued at the airport or border on arrival, usually for a fee. Often also available online in advance.'},
  E:{label:'e-Visa',color:'--c-evisa',desc:'Apply and pay online before travel, and carry the approval.'},
  V:{label:'Visa required',color:'--c-req',desc:'Get a visa in advance through an embassy, consulate or visa centre.'},
  X:{label:'No admission',color:'--c-no',desc:'Holders of this passport are currently refused entry or entry is suspended.'},
  S:{label:'Selected country',color:'--c-self',desc:''}
};
const ORDER=['F','T','A','E','V','X'];
const REGIONS=['Europe','Asia','Africa','Americas','Oceania'];

/*PROFILES*/

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function req(p,d){const k=V.m[IDX[p]][IDX[d]];const days=(V.d[p]||{})[d]||0;return{k:k==='-'?'S':k,days}}
function stay(r){if(r.k!=='F')return'';return r.days?r.days+' days':'No limit'}
const name=c=>META[c]?META[c].n:c;
const iso=c=>`<span class="iso">${c}</span>`;
function stats(c,dir){const s={F:0,T:0,A:0,E:0,V:0,X:0};CODES.forEach(o=>{if(o!==c)s[dir==='out'?req(c,o).k:req(o,c).k]++});return s}
const mob=s=>s.F+s.T+s.A;
const MOB={},OPEN={};CODES.forEach(c=>{MOB[c]=mob(stats(c,'out'));OPEN[c]=mob(stats(c,'in'))});
const mobTiers=[...new Set(Object.values(MOB))].sort((a,b)=>b-a);
const rankOf=c=>mobTiers.indexOf(MOB[c])+1;
const ordinalPassports=c=>CODES.filter(o=>MOB[o]>MOB[c]).length+1;

/* ---------- state ---------- */
let sel='TUR',mode='out',filter=null,tab='list',q='',focus=null;
try{const s=localStorage.getItem('ba.sel');if(s&&IDX[s]!==undefined)sel=s;const m=localStorage.getItem('ba.mode');if(m==='in'||m==='out')mode=m;const t=localStorage.getItem('ba.tab');if(t==='list'||t==='entry')tab=t}catch(e){}
function save(){try{localStorage.setItem('ba.sel',sel);localStorage.setItem('ba.mode',mode);localStorage.setItem('ba.tab',tab)}catch(e){}}
const relReq=c=>mode==='out'?req(sel,c):req(c,sel);
const keyOf=c=>!c||IDX[c]===undefined?null:(c===sel?'S':relReq(c).k);

/* =========================================================
   MAP — canvas renderer
   ========================================================= */
const wrap=$('#mapwrap'),canvas=$('#map'),ctx=canvas.getContext('2d');
const BW=1000,BH=520;
const world=window.WORLD;
const NUM={};V.countries.forEach(c=>{if(c.num)NUM[String(c.num).padStart(3,'0')]=c.c});
function codeOf(f){if(f.properties&&f.properties.name==='Kosovo')return'XKX';return f.id!=null?NUM[String(f.id).padStart(3,'0')]||null:null}
function prep(topo){const fc=topojson.feature(topo,topo.objects.countries);return fc.features.filter(f=>f.properties.name!=='Antarctica')}
const lowF=prep(world);
const proj=d3.geoNaturalEarth1().fitExtent([[6,6],[BW-6,BH-6]],{type:'FeatureCollection',features:lowF});
const gpath=d3.geoPath(proj);
function fixWind(f){const g=f.geometry;if(!g)return f;const polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(const p of polys){if(d3.geoArea({type:'Polygon',coordinates:p})>2*Math.PI)p.forEach(r=>r.reverse())}return f}
function makeFeat(f){fixWind(f);const b=gpath.bounds(f);return{f,code:codeOf(f),b,area:gpath.area(f),p:null,name:f.properties.name}}
const low=lowF.map(makeFeat);
low.forEach(o=>o.p=new Path2D(gpath(o.f)));
let high=null,highLoading=false;
const grat=new Path2D(gpath(d3.geoGraticule10()));
const sphere=new Path2D(gpath({type:'Sphere'}));
// label anchors and small-state dots
const shapeArea={};low.forEach(o=>{if(o.code)shapeArea[o.code]=Math.max(shapeArea[o.code]||0,o.area)});
const anchors={};V.countries.forEach(c=>{if(c.ll&&(c.ll[0]||c.ll[1])){const p=proj([c.ll[1],c.ll[0]]);if(p)anchors[c.c]=p}});
// fix anchors that fall outside their own shape (e.g. France via overseas, USA) using largest polygon centroid
low.forEach(o=>{if(!o.code||!anchors[o.code])return;const a=anchors[o.code];if(a[0]<o.b[0][0]||a[0]>o.b[1][0]||a[1]<o.b[0][1]||a[1]>o.b[1][1]){anchors[o.code]=gpath.centroid(o.f)}});
const dotList=V.countries.filter(c=>anchors[c.c]&&(shapeArea[c.c]===undefined||shapeArea[c.c]<8)).map(c=>({code:c.c,x:anchors[c.c][0],y:anchors[c.c][1],a:shapeArea[c.c]||0}));
const labelList=V.countries.filter(c=>anchors[c.c]).map(c=>({code:c.c,x:anchors[c.c][0],y:anchors[c.c][1],a:shapeArea[c.c]||0})).sort((a,b)=>b.a-a.a);

let cw=0,ch=0,dpr=1,s0=1,ox=0,oy=0,T=d3.zoomIdentity,raf=0,hover=null;
const MAXK=80;
// Adaptive rendering: while the user is panning/zooming we draw the light 50m borders; if even that can't keep up
// (slow GPU / huge screen) we transform a cached bitmap of the last frame and re-render sharply when the gesture pauses.
let interacting=false,slow=false,lastFrame=0,ema=16,snapT=null;
const snap=document.createElement('canvas'),sctx=snap.getContext('2d');
function takeSnap(){snap.width=canvas.width;snap.height=canvas.height;sctx.drawImage(canvas,0,0);snapT=T}
const zoom=d3.zoom().scaleExtent([1,MAXK])
  .on('start',()=>{interacting=true;lastFrame=0;canvas.classList.add('drag');takeSnap()})

const csel=d3.select(canvas).call(zoom).on('dblclick.zoom',function(e){const p=d3.pointer(e,canvas);csel.transition().duration(300).call(zoom.scaleBy,2,p)});
function resize(){
  const r=wrap.getBoundingClientRect();cw=Math.max(1,r.width);ch=Math.max(1,r.height);dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);
  s0=Math.min(cw/BW,ch/BH);ox=(cw-BW*s0)/2;oy=(ch-BH*s0)/2;
  zoom.extent([[0,0],[cw,ch]]).translateExtent([[Math.min(0,ox)-cw*.15,Math.min(0,oy)-ch*.15],[Math.max(cw,ox+BW*s0)+cw*.15,Math.max(ch,oy+BH*s0)+ch*.15]]);

}
new ResizeObserver(resize).observe(wrap);
function schedule(){if(!raf)raf=requestAnimationFrame(draw)}
let col={};
function readColors(){const cs=getComputedStyle(document.documentElement);['ocean','grat','border','nodata','halo','label','ink','panel'].forEach(k=>col[k]=cs.getPropertyValue('--'+k).trim());Object.keys(CAT).forEach(k=>col[k]=cs.getPropertyValue(CAT[k].color).trim());schedule()}
readColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function toBase(x,y){return[((x-T.x)/T.k-ox)/s0,((y-T.y)/T.k-oy)/s0]}
function toScreen(bx,by){return[T.x+T.k*(ox+s0*bx),T.y+T.k*(oy+s0*by)]}
function fillFor(code){const k=keyOf(code);if(!k)return col.nodata;return col[k]}
function drawSnap(){
  const r=T.k/snapT.k,tx=T.x-snapT.x*r,ty=T.y-snapT.y*r;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=col.ocean;ctx.fillRect(0,0,cw,ch);
  ctx.setTransform(dpr*r,0,0,dpr*r,dpr*tx,dpr*ty);ctx.imageSmoothingEnabled=true;ctx.drawImage(snap,0,0,cw,ch);

function draw(){
  raf=0;
  const now=performance.now();
  if(interacting){if(lastFrame&&now-lastFrame<250)ema=ema*.7+(now-lastFrame)*.3;lastFrame=now;if(ema>26)slow=true}
  if(interacting&&slow&&snapT){
    const r=T.k/snapT.k,dx=Math.abs(T.x-snapT.x*r),dy=Math.abs(T.y-snapT.y*r);
    if(r<2.2&&r>.45&&dx<cw*.35&&dy<ch*.35){drawSnap();return}
  }
  const K=T.k*s0;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=col.ocean;ctx.fillRect(0,0,cw,ch);
  ctx.setTransform(dpr*K,0,0,dpr*K,dpr*(T.x+T.k*ox),dpr*(T.y+T.k*oy));
  const [vx0,vy0]=toBase(0,0),[vx1,vy1]=toBase(cw,ch);
  const pad=2/K;
  // graticule
  ctx.lineWidth=.6/K;ctx.strokeStyle=col.grat;ctx.stroke(grat);ctx.stroke(sphere);
  const useHigh=high&&K>3&&!interacting;
  const set=useHigh?high:low;
  const vis=[];
  for(const o of set){const b=o.b;if(b[1][0]<vx0-pad||b[0][0]>vx1+pad||b[1][1]<vy0-pad||b[0][1]>vy1+pad)continue;if(!o.p)o.p=new Path2D(gpath(o.f));vis.push(o)}
  for(const o of vis){const k=keyOf(o.code);ctx.globalAlpha=(filter&&k&&k!=='S'&&k!==filter)?.22:1;ctx.fillStyle=k?col[k]:col.nodata;ctx.fill(o.p)}
  ctx.globalAlpha=1;
  ctx.lineWidth=Math.min(.8,.5+K*.01)/K;ctx.strokeStyle=col.border;ctx.lineJoin='round';
  for(const o of vis)ctx.stroke(o.p);
  // selected + hover + focus outlines
  const outline=(code,w,c)=>{if(!code)return;ctx.lineWidth=w/K;ctx.strokeStyle=c;for(const o of vis)if(o.code===code)ctx.stroke(o.p)};
  outline(focus,2.2,col.ink);
  if(hover&&hover!==focus)outline(hover,1.4,col.ink);
  // screen space: dots, labels
  ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const d of dotList){
    if(d.a*K*K>40)continue;
    const [x,y]=toScreen(d.x,d.y);if(x<-10||y<-10||x>cw+10||y>ch+10)continue;
    const k=keyOf(d.code);
    ctx.globalAlpha=(filter&&k&&k!=='S'&&k!==filter)?.25:1;
    ctx.beginPath();ctx.arc(x,y,K>6?5:K>2?4:3,0,Math.PI*2);ctx.fillStyle=k?col[k]:col.nodata;ctx.fill();
    ctx.lineWidth=(d.code===hover||d.code===focus)?2:1;ctx.strokeStyle=(d.code===hover||d.code===focus)?col.ink:col.border;ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(K>=1.6)drawLabels(K);
  if(interacting&&slow)takeSnap();
  if(!interacting)slow=slow&&ema>26;
}
const WCACHE=new Map();let FONT=null;
function drawLabels(K){if(!FONT)FONT=getComputedStyle(document.body).fontFamily;
  ctx.font=`600 ${K>8?12:11}px ${FONT}`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  const placed=[];
  for(const l of labelList){
    const [x,y]=toScreen(l.x,l.y);if(x<0||y<0||x>cw||y>ch)continue;
    const nm=name(l.code);const ck=ctx.font+nm;let w=WCACHE.get(ck);if(w===undefined){w=ctx.measureText(nm).width;WCACHE.set(ck,w)}
    const shapePx=Math.sqrt(l.a)*K;
    if(shapePx<w*0.55&&!(l.a===0&&K>10)&&!(shapePx>0&&K>14))continue;
    const r=[x-w/2-3,y-8,x+w/2+3,y+8];
    if(placed.some(p=>!(r[2]<p[0]||r[0]>p[2]||r[3]<p[1]||r[1]>p[3])))continue;
    placed.push(r);
    const yy=l.a<8?y-12:y;
    ctx.lineWidth=3;ctx.strokeStyle=col.halo;ctx.strokeText(nm,x,yy);ctx.fillStyle=col.label;ctx.fillText(nm,x,yy);
    if(placed.length>140)break;
  }
}
function loadHigh(){
  if(high||highLoading)return;highLoading=true;
  fetch('world-10m.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(t=>{
    setTimeout(()=>{high=prep(t).map(makeFeat);schedule()},0);

}
// hit testing
const hitCtx=document.createElement('canvas').getContext('2d');
function hit(x,y){
  const K=T.k*s0;
  for(const d of dotList){if(d.a*K*K>40)continue;const [sx,sy]=toScreen(d.x,d.y);if((sx-x)**2+(sy-y)**2<81)return d.code}
  const [bx,by]=toBase(x,y);
  const set=(high&&K>3)?high:low;
  for(const o of set){const b=o.b;if(bx<b[0][0]||bx>b[1][0]||by<b[0][1]||by>b[1][1])continue;if(!o.p)o.p=new Path2D(gpath(o.f));if(hitCtx.isPointInPath(o.p,bx,by))return o.code||('?'+o.name)}

}
const tip=$('#tip');
let moveRaf=0,lastMove=null;
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse')return;lastMove=e;if(!moveRaf)moveRaf=requestAnimationFrame(onMove)});
function onMove(){
  moveRaf=0;const e=lastMove;if(canvas.classList.contains('drag'))return;
  const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const h=hit(x,y);const code=h&&h[0]!=='?'?h:null;

  else{const rr=relReq(code);tip.innerHTML=`<b>${esc(name(code))}</b><small>${mode==='out'?esc(name(sel))+' passport':esc(name(code))+' passport → '+esc(name(sel))}</small><div class="k"><i style="background:${col[rr.k]}"></i>${CAT[rr.k].label}${rr.days?' · '+rr.days+' days':''}</div>`}
  tip.hidden=false;
  const tw=tip.offsetWidth,th=tip.offsetHeight;

}
canvas.addEventListener('pointerleave',()=>{tip.hidden=true;if(hover){hover=null;schedule()}});
canvas.addEventListener('click',e=>{

$('#zIn').onclick=()=>csel.transition().duration(250).call(zoom.scaleBy,2);

function updScale(){$('#scale').textContent=(T.k<10?T.k.toFixed(1):Math.round(T.k))+'×';$('#zIn').disabled=T.k>=MAXK-.01;$('#zOut').disabled=T.k<=1.001}
function zoomTo(code){
  const os=low.filter(o=>o.code===code);let b;
  if(os.length){b=os.reduce((m,o)=>o.area>m.area?o:m).b}else if(anchors[code]){const a=anchors[code];b=[[a[0]-4,a[1]-4],[a[0]+4,a[1]+4]]}else return;
  const [x0,y0]=[ox+s0*b[0][0],oy+s0*b[0][1]],[x1,y1]=[ox+s0*b[1][0],oy+s0*b[1][1]];

  $('#tabList').setAttribute('aria-selected',tab==='list');$('#tabEntry').setAttribute('aria-selected',tab==='entry');
  $('#tabList').textContent=mode==='out'?'Destinations':'Nationalities';
  $('#tabEntry').textContent=`Entering ${name(sel)}`;
  pin.value=name(sel);$('#pickCode').textContent=sel;
  $('#mtitle').innerHTML=`<span>${mode==='out'?`Where a <b>${esc(name(sel))}</b> passport can go`:`Who can enter <b>${esc(name(sel))}</b>`}</span>`;
  renderSummary();renderLegend();renderRegions();renderPanel();schedule();
  document.documentElement.style.setProperty('--headH',$('#head').offsetHeight+'px');
}
renderAll();updScale();
setTimeout(()=>{(window.requestIdleCallback||setTimeout)(loadHigh)},1200);
if(document.fonts)document.fonts.ready.then(()=>{WCACHE.clear();schedule()});
})();
</script>
