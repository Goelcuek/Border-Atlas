<title>Border Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a passport "data page" header over a full-width map, then a two-column dossier (your passport | entering the selected country) with a detail sheet for any clicked border. */
:root{
  --bg:#eef1f5; --paper:#f8f9fb; --panel:#ffffff; --ink:#15202e; --muted:#5b6778; --line:#d6dce5; --soft:#e5e9f0;
  --accent:#1f4fbf; --accent-ink:#ffffff; --ocean:#e3e9f1; --nodata:#c9cfd8; --land-stroke:#ffffff;
  --c-free:#1c9a6b; --c-eta:#86bf4a; --c-voa:#e6b33e; --c-evisa:#ee8636; --c-req:#d4415a; --c-no:#4b3a52; --c-self:#1f4fbf;
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --paper:#121a24; --panel:#17212d; --ink:#e6ebf2; --muted:#93a0b2; --line:#283444; --soft:#1e2a38;
  --accent:#6e9bff; --accent-ink:#0b1220; --ocean:#101924; --nodata:#2f3a48; --land-stroke:#0e141c;
  --c-free:#2fb582; --c-eta:#93c95a; --c-voa:#e8bb4f; --c-evisa:#f0924a; --c-req:#e45b72; --c-no:#8b6f97; --c-self:#6e9bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --paper:#121a24; --panel:#17212d; --ink:#e6ebf2; --muted:#93a0b2; --line:#283444; --soft:#1e2a38;
  --accent:#6e9bff; --accent-ink:#0b1220; --ocean:#101924; --nodata:#2f3a48; --land-stroke:#0e141c;
  --c-free:#2fb582; --c-eta:#93c95a; --c-voa:#e8bb4f; --c-evisa:#f0924a; --c-req:#e45b72; --c-no:#8b6f97; --c-self:#6e9bff; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono)}
.tab{font-variant-numeric:tabular-nums}

/* Header */
header.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.top .wrap{display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.01em;margin:0}
.brand small{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}

.picker{position:relative;min-width:0;flex:1 1 300px;max-width:420px}
.picker label{position:absolute;left:12px;top:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);pointer-events:none}
.picker input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:20px 40px 7px 12px;font-size:15px;font-weight:500}
.picker .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.picker ul{position:absolute;left:0;right:0;top:calc(100% + 6px);max-height:min(60vh,420px);overflow:auto;margin:0;padding:6px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 40px rgba(10,20,40,.18);z-index:40}
.picker li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer}
.picker li[aria-selected="true"],.picker li:hover{background:var(--soft)}
.picker li .iso{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.flag{font-size:1.15em;line-height:1}

.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Passport data strip */
.datapage{display:grid;grid-template-columns:auto 1fr auto;gap:18px 24px;align-items:center;padding-block:22px 16px}
.bigflag{font-size:56px;line-height:1;width:76px;height:76px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.dp-main{min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dp-main h2{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3.4vw,40px);line-height:1.1;margin:4px 0 6px;text-wrap:balance}
.dp-main p{margin:0;color:var(--muted);max-width:70ch}
.mrz{grid-column:1/-1;font-family:var(--font-mono);font-size:clamp(10px,1.35vw,14px);letter-spacing:.18em;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;overflow:hidden;white-space:nowrap;text-overflow:clip}
.score{display:flex;gap:22px;flex-wrap:wrap}
.score div{min-width:92px}
.score b{display:block;font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.score span{font-size:12px;color:var(--muted)}

/* Map */
.mapcard{position:relative;background:var(--ocean);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#map{display:block;width:100%;height:clamp(300px,52vw,620px);cursor:grab;touch-action:none}
#map:active{cursor:grabbing}
#map path.c{stroke:var(--land-stroke);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .35s ease,opacity .25s}
#map circle.c{stroke:var(--land-stroke);stroke-width:1;vector-effect:non-scaling-stroke;transition:fill .35s ease,opacity .25s}
#map .c{cursor:pointer;fill:var(--nodata)}
#map .c:hover{stroke:var(--ink);stroke-width:1.4}
#map .c.focus{stroke:var(--ink);stroke-width:2}
.k-F{fill:var(--c-free)!important}.k-T{fill:var(--c-eta)!important}.k-A{fill:var(--c-voa)!important}.k-E{fill:var(--c-evisa)!important}.k-V{fill:var(--c-req)!important}.k-X{fill:var(--c-no)!important}.k-S{fill:var(--c-self)!important}
#map .dim{opacity:.18}
.mapbar{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.mapbar>*{pointer-events:auto}
.maptitle{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;max-width:100%}
.zoom{display:flex;flex-direction:column;gap:6px;position:absolute;right:12px;bottom:12px}
.zoom button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 0}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px 6px 8px;cursor:pointer;font-size:13px}
.chip i{width:14px;height:14px;border-radius:4px;display:inline-block}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.off{opacity:.45}
.hint{font-size:12.5px;color:var(--muted);margin-left:auto;align-self:center}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;box-shadow:0 10px 30px rgba(10,20,40,.2);font-size:13px;max-width:260px}
.tip strong{display:block;font-weight:600}
.tip .pill{margin-top:4px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px 2px 8px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--soft)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.p-F{color:var(--c-free)}.p-T{color:var(--c-eta)}.p-A{color:var(--c-voa)}.p-E{color:var(--c-evisa)}.p-V{color:var(--c-req)}.p-X{color:var(--c-no)}.p-S{color:var(--c-self)}

/* Dossier grid */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;padding-block:22px 40px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.card+.card{margin-top:20px}
.card h3{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0 0 4px;text-wrap:balance}
.card .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft)}
.stack span{display:block;height:100%}
.regions{display:grid;gap:10px;margin-top:6px}
.reg{display:grid;grid-template-columns:96px 1fr 64px;gap:12px;align-items:center;font-size:13.5px}
.reg .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}

.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tools input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tabs button i{width:9px;height:9px;border-radius:50%}
.list{max-height:520px;overflow:auto;margin:0 -6px;padding:0 6px}
.group h4{position:sticky;top:0;background:var(--panel);margin:0;padding:10px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);display:flex;gap:8px;align-items:center;z-index:1}
.group h4 i{width:10px;height:10px;border-radius:3px}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:2px 12px}
.row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%;min-width:0}
.row:hover{background:var(--soft)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .d{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.empty{color:var(--muted);font-size:14px;padding:12px 0}

/* Entry profile */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px;margin:4px 0 18px;padding:14px;background:var(--paper);border:1px solid var(--soft);border-radius:10px}
.facts dt{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:14px;font-weight:500}
.reqs{display:grid;gap:0;margin:0}
.reqs>div{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:11px 0;border-top:1px solid var(--soft)}
.reqs>div:first-child{border-top:0}
.reqs dt{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.reqs dd{margin:0;font-size:14.5px}
.official{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:9px 14px;border-radius:9px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14px}
.tag{font-family:var(--font-mono);font-size:11px;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--muted);letter-spacing:.06em}
.openbar{margin:4px 0 16px}
.openbar .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,24,.35);z-index:70}
.sheet{position:fixed;z-index:80;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(10,20,40,.25);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);animation:slide .28s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.sheet header h3{font-family:var(--font-display);font-weight:700;font-size:20px;margin:2px 0 0;line-height:1.2}
.sheet .x{margin-left:auto;border:1px solid var(--line);background:var(--paper);width:34px;height:34px;border-radius:9px;cursor:pointer;flex:none;font-size:18px}
.sheet .body{overflow:auto;padding:18px 20px 28px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px;border-radius:12px;background:var(--paper);border:1px solid var(--soft);margin-bottom:16px}
.route .end{text-align:center;min-width:0}
.route .end .flag{font-size:30px;display:block}
.route .end span{font-size:13px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route .arrow{color:var(--muted);font-family:var(--font-mono)}
.verdict{border-radius:12px;padding:14px 16px;margin-bottom:18px;border:1px solid var(--line)}
.verdict b{display:block;font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:4px}
.verdict p{margin:0;font-size:14px;color:var(--muted)}
.sheet h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--font-mono);margin:22px 0 8px}
.recip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:500;font-size:13.5px}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .wrap{padding-block:20px 30px;display:grid;gap:6px}
footer a{color:var(--accent)}

@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .datapage{grid-template-columns:auto 1fr}
  .score{grid-column:1/-1}
  .bigflag{font-size:40px;width:58px;height:58px}
  .reqs>div{grid-template-columns:1fr;gap:2px}
  .reg{grid-template-columns:78px 1fr 52px}
  .sheet{top:auto;left:0;width:100%;max-height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding-left:env(safe-area-inset-left,0px);animation:up .28s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .hint{display:none}
  header.top .wrap{gap:10px}
  .seg{width:100%}.seg button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="2" width="24" height="28" rx="4" fill="var(--accent)"/><circle cx="16" cy="14" r="6.2" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/><path d="M9.8 14h12.4M16 7.8c2.4 2.2 2.4 10.2 0 12.4M16 7.8c-2.4 2.2-2.4 10.2 0 12.4" stroke="var(--accent-ink)" stroke-width="1.3" fill="none"/><rect x="10" y="24" width="12" height="1.6" rx=".8" fill="var(--accent-ink)"/></svg>
      <div><h1>Border Atlas</h1><small>Visa &amp; entry requirements</small></div>
    </div>
    <div class="picker" id="picker">
      <label for="pickIn">Your passport / country</label>
      <input id="pickIn" type="text" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="pickList">
      <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <ul id="pickList" role="listbox" hidden></ul>
    </div>
    <div class="seg" role="group" aria-label="Map direction">
      <button id="modeOut" aria-pressed="true">Travelling from</button>
      <button id="modeIn" aria-pressed="false">Travelling to</button>
    </div>
  </div>
</header>

<main>
  <section class="wrap datapage" id="datapage"></section>
  <section class="wrap">
    <div class="mapcard">
      <svg id="map" role="img" aria-label="World map coloured by visa requirement"></svg>
      <div class="mapbar"><div class="maptitle" id="mapTitle"></div></div>
      <div class="zoom"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button><button id="zReset" aria-label="Reset view">⟲</button></div>
    </div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="wrap grid">
    <div>
      <div class="card" id="breakdown"></div>
      <div class="card" id="listCard"></div>
    </div>
    <div>
      <div class="card" id="entry"></div>
    </div>
  </section>
</main>

<footer><div class="wrap" id="foot"></div></footer>
<div class="tip" id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></aside>

function inStats(d){const s={F:0,T:0,A:0,E:0,V:0,X:0};CODES.forEach(p=>{if(d!==p)s[req(p,d).k]++});return s}

/* ---------- map ---------- */
const svg=d3.select('#map');
const g=svg.append('g');

const fc=topojson.feature(world,world.objects.countries);
fc.features=fc.features.filter(f=>f.properties.name!=='Antarctica');
const NUM={};V.countries.forEach(c=>{if(c.num)NUM[String(c.num).padStart(3,'0')]=c.c});
fc.features.forEach(f=>{f.code=f.properties.name==='Kosovo'?'XKX':(f.id?NUM[String(f.id).padStart(3,'0')]:null)});
const W=1000,H=520;
svg.attr('viewBox',`0 0 ${W} ${H}`).attr('preserveAspectRatio','xMidYMid meet');
const proj=d3.geoNaturalEarth1().fitExtent([[8,8],[W-8,H-8]],{type:'FeatureCollection',features:fc.features});
const path=d3.geoPath(proj);
g.append('path').attr('d',path(d3.geoGraticule10())).attr('fill','none').attr('stroke','var(--line)').attr('stroke-width',.4).attr('vector-effect','non-scaling-stroke').attr('opacity',.6);
const shapes=g.append('g').selectAll('path').data(fc.features).join('path').attr('class','c').attr('d',path);
// dots for small or missing countries
const have={};fc.features.forEach(f=>{if(f.code){const a=path.area(f);have[f.code]=Math.max(have[f.code]||0,a)}});
const dotData=V.countries.filter(c=>(have[c.c]===undefined||have[c.c]<6)&&c.ll&&(c.ll[0]||c.ll[1])).map(c=>{const p=proj([c.ll[1],c.ll[0]]);return{code:c.c,x:p[0],y:p[1]}});
const dots=g.append('g').selectAll('circle').data(dotData).join('circle').attr('class','c').attr('cx',d=>d.x).attr('cy',d=>d.y).attr('r',3.2);
const zoom=d3.zoom().scaleExtent([1,12]).translateExtent([[0,0],[W,H]]).on('zoom',e=>{g.attr('transform',e.transform);dots.attr('r',3.2/Math.sqrt(e.transform.k))});
svg.call(zoom).on('dblclick.zoom',null);
$('#zIn').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.6);
$('#zOut').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6);

const tip=$('#tip');
function tipHTML(code){
  if(!code||IDX[code]===undefined)return null;
  if(code===sel)return`<strong>${flag(code)} ${esc(name(code))}</strong><span class="pill p-S">Selected</span>`;
  const r=relReq(code);
  const who=mode==='out'?`${esc(name(sel))} passport → here`:`${esc(name(code))} passport → ${esc(name(sel))}`;
  return`<strong>${flag(code)} ${esc(name(code))}</strong><span style="color:var(--muted);font-size:12px">${who}</span><br><span class="pill p-${r.k}">${CAT[r.k].short}${daysTxt(r)?' · '+daysTxt(r):''}</span>`;
}
function bindHover(sel_){
  sel_.on('mousemove',(e,d)=>{const h=tipHTML(d.code);if(!h){tip.hidden=true;return}tip.innerHTML=h;tip.hidden=false;
      const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8),y=Math.min(e.clientY+14,innerHeight-tip.offsetHeight-8);tip.style.left=x+'px';tip.style.top=y+'px'})
    .on('mouseleave',()=>tip.hidden=true)
    .on('click',(e,d)=>{tip.hidden=true;if(d.code&&IDX[d.code]!==undefined)openSheet(d.code)});
}
bindHover(shapes);bindHover(dots);
shapes.append('title').text(d=>d.code?name(d.code):d.properties.name+' (no data)');

function paintMap(){
  const cls=d=>{if(!d.code||IDX[d.code]===undefined)return'c';const k=d.code===sel?'S':relReq(d.code).k;const dim=filter&&k!=='S'&&k!==filter;return`c k-${k}${dim?' dim':''}`};
  shapes.attr('class',cls);dots.attr('class',cls);
  $('#mapTitle').innerHTML=mode==='out'
    ?`${flag(sel)} What a <b>${esc(name(sel))}</b> passport needs, by destination`
    :`${flag(sel)} What each passport needs to enter <b>${esc(name(sel))}</b>`;
}

let active=0,shown=[];
function renderPick(f){
  const t=(f||'').toLowerCase().trim();
  shown=sortedCountries.filter(c=>!t||c.n.toLowerCase().includes(t)||c.c.toLowerCase()===t||(c.o||'').toLowerCase().includes(t));
  active=0;
  plist.innerHTML=shown.map((c,i)=>`<li role="option" id="opt-${c.c}" data-c="${c.c}" aria-selected="${i===0}"><span class="flag">${c.f}</span>${esc(c.n)}<span class="iso">${c.c}</span></li>`).join('')||'<li class="empty">No country matches</li>';
}
function openPick(){renderPick('');plist.hidden=false;pin.setAttribute('aria-expanded','true');pin.select()}
function closePick(){plist.hidden=true;pin.setAttribute('aria-expanded','false');pin.value=`${flag(sel)}  ${name(sel)}`}
pin.addEventListener('focus',openPick);
pin.addEventListener('input',()=>{renderPick(pin.value);plist.hidden=false});
pin.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!shown.length)return;active=(active+(e.key==='ArrowDown'?1:-1)+shown.length)%shown.length;
    [...plist.children].forEach((li,i)=>li.setAttribute('aria-selected',i===active));plist.children[active].scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){e.preventDefault();if(shown[active]){choose(shown[active].c);pin.blur()}}
  else if(e.key==='Escape'){closePick();pin.blur()}
});
plist.addEventListener('mousedown',e=>{const li=e.target.closest('li[data-c]');if(li){e.preventDefault();choose(li.dataset.c);pin.blur()}});
pin.addEventListener('blur',()=>setTimeout(closePick,120));
function choose(c){sel=c;filter=null;q='';listTab='all';save();renderAll();closePick()}

/* ---------- mode ---------- */
function setMode(m){mode=m;filter=null;save();$('#modeOut').setAttribute('aria-pressed',m==='out');$('#modeIn').setAttribute('aria-pressed',m==='in');renderAll()}
$('#modeOut').onclick=()=>setMode('out');$('#modeIn').onclick=()=>setMode('in');

/* ---------- sections ---------- */
function mrz(c){const n=name(c).toUpperCase().replace(/[^A-Z ]/g,'').replace(/ +/g,'<');let l1=('P<'+c+n+'<<TRAVELLER').padEnd(44,'<').slice(0,44);let l2=(c+'0000000<0'+c+'9001017M3012315<<<<<<<<<<<<<<06').padEnd(44,'<').slice(0,44);return (l1+'   '+l2).replace(/</g,'&lt;').replace(/ /g,'&nbsp;')}
function renderHeader(){
  const m=META[sel], so=outStats(sel), si=inStats(sel);
  $('#datapage').innerHTML=`
   <div class="bigflag" aria-hidden="true">${m.f}</div>
   <div class="dp-main"><div class="eyebrow">${esc(m.r)}${m.sr&&m.sr!==m.r?' · '+esc(m.sr):''} · ${sel}</div>
     <h2>${esc(m.n)}</h2>
     <p>${mode==='out'?`A ${esc(m.n)} passport opens <b>${mob(so)}</b> of ${N-1} destinations without a prior visa (visa-free, eTA or visa on arrival).`:`<b>${OPEN[sel]}</b> of ${N-1} passports can enter ${esc(m.n)} without arranging a visa in advance.`}</p></div>
   <div class="score">
     <div><b class="tab">${mob(so)}</b><span>Mobility score</span></div>
     <div><b class="tab">#${rankOf(sel)}</b><span>Passport rank</span></div>
     <div><b class="tab">${OPEN[sel]}</b><span>Passports welcomed</span></div>
   </div>
   <div class="mrz" aria-hidden="true">${mrz(sel)}</div>`;
}
function renderLegend(){
  const s=mode==='out'?outStats(sel):inStats(sel);
  $('#legend').innerHTML=ORDER.filter(k=>s[k]>0||k!=='X').map(k=>`<button class="chip${filter&&filter!==k?' off':''}" data-k="${k}" aria-pressed="${filter===k}"><i style="background:var(${CAT[k].color})"></i>${CAT[k].label} <b>${s[k]}</b></button>`).join('')
   +`<span class="chip" style="cursor:default"><i style="background:var(--c-self)"></i>Selected</span><span class="chip" style="cursor:default"><i style="background:var(--nodata)"></i>Territory / no data</span><span class="hint">Tap a category to isolate it · tap any country for details</span>`;
  $('#legend').querySelectorAll('button.chip').forEach(b=>b.onclick=()=>{filter=filter===b.dataset.k?null:b.dataset.k;listTab=filter||'all';renderLegend();paintMap();renderList()});
}
function renderBreakdown(){
  const s=mode==='out'?outStats(sel):inStats(sel), tot=N-1;
  const bar=st=>{const t=ORDER.reduce((a,k)=>a+st[k],0)||1;return`<div class="stack">${ORDER.map(k=>st[k]?`<span style="width:${st[k]/t*100}%;background:var(${CAT[k].color})" title="${CAT[k].label}: ${st[k]}"></span>`:'').join('')}</div>`};
  const rows=REGIONS.map(r=>{const st={F:0,T:0,A:0,E:0,V:0,X:0};let n=0,easy=0;CODES.forEach(c=>{if(c===sel||META[c].r!==r)return;const k=relReq(c).k;st[k]++;n++;if('FTA'.includes(k))easy++});return`<div class="reg"><span>${r}</span>${bar(st)}<span class="n">${easy}/${n}</span></div>`}).join('');
  const longest=mode==='out'?CODES.filter(c=>c!==sel&&req(sel,c).k==='F'&&req(sel,c).days>=180).length:0;
  $('#breakdown').innerHTML=`<h3>${mode==='out'?'Where this passport takes you':'Who can come in'}</h3>
   <p class="sub">${mode==='out'?`Share of ${tot} destinations by entry type, then by region. Right column: destinations open without a prior visa.`:`Share of ${tot} passports by what they need to enter ${esc(name(sel))}.`}</p>
   ${bar(s)}
   <div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 0 18px;font-size:13px;color:var(--muted)">${ORDER.filter(k=>s[k]).map(k=>`<span><b style="color:var(--ink)" class="tab">${Math.round(s[k]/tot*100)}%</b> ${CAT[k].short.toLowerCase()}</span>`).join('')}${longest?`<span><b style="color:var(--ink)" class="tab">${longest}</b> allow 180+ days</span>`:''}</div>
   <div class="regions">${rows}</div>`;
}
function renderList(){
  const card=$('#listCard');
  const s=mode==='out'?outStats(sel):inStats(sel);
  const groups=ORDER.map(k=>({k,items:CODES.filter(c=>c!==sel&&relReq(c).k===k&&(!q||name(c).toLowerCase().includes(q))).sort((a,b)=>name(a).localeCompare(name(b)))}));
  const vis=groups.filter(gr=>gr.items.length&&(listTab==='all'||listTab===gr.k));
  card.innerHTML=`<h3>${mode==='out'?'All destinations':'All passports'}</h3>
   <p class="sub">${mode==='out'?`Entry rules for ${esc(name(sel))} citizens, with the maximum visa-free stay.`:`Rules for each nationality entering ${esc(name(sel))}.`}</p>
   <div class="tools"><input id="q" type="search" placeholder="Filter by country name" value="${esc(q)}" aria-label="Filter list"></div>
   <div class="tabs"><button data-t="all" aria-pressed="${listTab==='all'}">All <span class="tab">${N-1}</span></button>${ORDER.filter(k=>s[k]).map(k=>`<button data-t="${k}" aria-pressed="${listTab===k}"><i style="background:var(${CAT[k].color})"></i>${CAT[k].short} <span class="tab">${s[k]}</span></button>`).join('')}</div>
   <div class="list">${vis.length?vis.map(gr=>`<div class="group"><h4><i style="background:var(${CAT[gr.k].color})"></i>${CAT[gr.k].label} · ${gr.items.length}</h4><div class="rows">${gr.items.map(c=>{const r=relReq(c);return`<button class="row" data-c="${c}"><span class="flag">${flag(c)}</span><span class="nm">${esc(name(c))}</span><span class="d">${daysTxt(r)}</span></button>`}).join('')}</div></div>`).join(''):'<p class="empty">No countries match this filter.</p>'}</div>`;
  const qi=card.querySelector('#q');
  qi.oninput=()=>{q=qi.value.toLowerCase().trim();const pos=qi.selectionStart;renderList();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  card.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{listTab=b.dataset.t;filter=listTab==='all'?null:listTab;renderList();renderLegend();paintMap()});
  card.querySelectorAll('.row').forEach(b=>b.onclick=()=>openSheet(b.dataset.c));
}
function genericProfile(c){
  const si=inStats(c),m=META[c];
  const dom=ORDER.reduce((a,k)=>si[k]>si[a]?k:a,'F');
  const items=[
    ['Most visitors',`${CAT[dom].label} applies to ${si[dom]} of ${N-1} nationalities.`],
    ['Passport','Carry a passport valid at least 6 months beyond your arrival with at least one blank page; many airlines enforce this even where the law is looser.'],
    ['Proof','Expect to show a return or onward ticket, accommodation details and enough funds for the stay.']
  ];
  if(si.A)items.push(['On arrival',`${si.A} nationalities can get a visa at the border. Carry cash in USD or EUR and passport photos in case card payment is unavailable.`]);
  if(si.E)items.push(['e-Visa',`${si.E} nationalities apply online in advance. Use the government portal and avoid look-alike agent sites.`]);
  if(m.r==='Africa'||m.sr==='South America')items.push(['Health','A yellow fever vaccination certificate may be required, particularly if you arrive from or transit through a risk country.']);
  return{items,generic:true};
}
function renderEntry(){
  const c=sel,m=META[c],p=P[c]||genericProfile(c),si=inStats(c);
  const t=N-1;
  $('#entry').innerHTML=`<div class="eyebrow">Entry requirements</div>
   <h3 style="font-size:22px;font-weight:700;margin-top:4px">Entering ${esc(m.n)}</h3>
   <p class="sub">${p.generic?'General guidance built from the visa data. ':'Key rules for visitors. '}Always confirm with the official source before you travel.</p>
   ${(p.tags||[]).length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px">${p.tags.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div>`:''}
   <dl class="facts">
     <div><dt>Capital</dt><dd>${esc(m.cap||'—')}</dd></div>
     <div><dt>Currency</dt><dd>${esc(m.cur.join(', ')||'—')}</dd></div>
     <div><dt>Languages</dt><dd>${esc(m.lang.join(', ')||'—')}</dd></div>
     <div><dt>Dialling code</dt><dd class="mono">${esc(m.idd||'—')}</dd></div>
     <div><dt>Openness rank</dt><dd class="tab">#${openRankOf(c)} of ${sortedOpen.length} tiers</dd></div>
     <div><dt>Land borders</dt><dd>${m.b.length?m.b.length+' countries':'None (island / enclave)'}</dd></div>
   </dl>
   <div class="openbar"><div class="lbl"><span>Passports that need no prior visa</span><span class="tab">${OPEN[c]} / ${t}</span></div>
     <div class="stack">${ORDER.map(k=>si[k]?`<span style="width:${si[k]/t*100}%;background:var(${CAT[k].color})" title="${CAT[k].label}: ${si[k]}"></span>`:'').join('')}</div></div>
   <dl class="reqs">${p.items.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>
   ${p.link?`<a class="official" href="${p.link[1]}" target="_blank" rel="noopener">${esc(p.link[0])} ↗</a>`:`<a class="official" href="https://www.iatatravelcentre.com/" target="_blank" rel="noopener">IATA Travel Centre ↗</a>`}
   <div class="btnrow"><button class="btn" id="seeIn">${mode==='in'?'Showing who can enter on the map':'Show who can enter on the map'}</button></div>`;
  $('#seeIn').onclick=()=>{if(mode!=='in'){setMode('in')}document.querySelector('.mapcard').scrollIntoView({behavior:'smooth',block:'center'})};
}

/* ---------- detail sheet ---------- */
const sheet=$('#sheet'),scrim=$('#scrim');let lastFocus=null;
function openSheet(c){
  lastFocus=document.activeElement;
  const from=mode==='out'?sel:c, to=mode==='out'?c:sel;
  const r=req(from,to), back=req(to,from), pm=META[to], prof=P[to]||genericProfile(to);
  const verdictColor=`var(${CAT[r.k]?.color||'--c-self'})`;
  const sameEU=EU.includes(from)&&(EU.includes(to)||SCH.includes(to));
  let note=CAT[r.k]?CAT[r.k].desc:'';
  if(r.k==='F'&&r.days)note=`Visa-free for up to ${r.days} days. `+(SCH.includes(to)&&!EU.includes(from)&&!['ISL','NOR','CHE','LIE'].includes(from)?'Schengen days are counted across all member states.':'');
  if(r.k==='F'&&!r.days)note=sameEU?'Freedom of movement: no time limit for short visits, and a national ID card is usually enough.':'Visa-free with no fixed limit for visits.';
  sheet.innerHTML=`<header><div><div class="eyebrow">${from===to?'':'Border detail'}</div><h3>${flag(to)} ${esc(name(to))}</h3></div><button class="x" id="sx" aria-label="Close">×</button></header>
   <div class="body">
    <div class="route"><div class="end"><span class="flag">${flag(from)}</span><span>${esc(name(from))} passport</span></div><div class="arrow">──▶</div><div class="end"><span class="flag">${flag(to)}</span><span>${esc(name(to))}</span></div></div>
    <div class="verdict" style="border-color:${verdictColor};background:color-mix(in srgb,${verdictColor} 10%,var(--panel))"><b style="color:${verdictColor}">${CAT[r.k]?CAT[r.k].label:'Home country'}${daysTxt(r)&&r.days?' · '+r.days+' days':''}</b><p>${esc(note)}</p></div>
    <h4>The other way</h4>
    <div class="recip"><span>${flag(to)} ${esc(name(to))} passport → ${flag(from)} ${esc(name(from))}</span><span class="pill p-${back.k}">${CAT[back.k]?CAT[back.k].short:''}${back.k==='F'&&back.days?' · '+back.days+' d':''}</span>${back.k===r.k?'<span class="tag">Reciprocal</span>':'<span class="tag">Not reciprocal</span>'}</div>
    <h4>Entering ${esc(pm.n)}</h4>
    <dl class="reqs">${prof.items.map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>
    <h4>Quick facts</h4>
    <dl class="facts" style="margin-bottom:0"><div><dt>Capital</dt><dd>${esc(pm.cap||'—')}</dd></div><div><dt>Currency</dt><dd>${esc(pm.cur.join(', ')||'—')}</dd></div><div><dt>Languages</dt><dd>${esc(pm.lang.join(', ')||'—')}</dd></div><div><dt>Passports welcomed</dt><dd class="tab">${OPEN[to]} / ${N-1}</dd></div></dl>
    ${prof.link?`<a class="official" href="${prof.link[1]}" target="_blank" rel="noopener">${esc(prof.link[0])} ↗</a>`:`<a class="official" href="https://www.iatatravelcentre.com/" target="_blank" rel="noopener">Check on IATA Travel Centre ↗</a>`}
    <div class="btnrow"><button class="btn" id="mk">Make ${esc(name(c))} the selected country</button></div>
   </div>`;
  sheet.hidden=false;scrim.hidden=false;
  shapes.classed('focus',d=>d.code===c);dots.classed('focus',d=>d.code===c);
  $('#sx').onclick=closeSheet;$('#mk').onclick=()=>{closeSheet();choose(c);window.scrollTo({top:0,behavior:'smooth'})};
  $('#sx').focus();
}
function closeSheet(){sheet.hidden=true;scrim.hidden=true;shapes.classed('focus',false);dots.classed('focus',false);if(lastFocus&&lastFocus.focus)lastFocus.focus()}
scrim.onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

$('#foot').innerHTML=`<div>Visa matrix: <a href="https://github.com/ilyankou/passport-index-dataset" target="_blank" rel="noopener">Passport Index open dataset</a> (199 passports × 199 destinations, January 2025), updated for later changes: UK ETA extended to EU and all visa-exempt nationals (2025), Israel ETA-IL (2025), visas reinstated by Brazil for US, Canadian and Australian citizens (April 2025), and China's 30-day visa-free list including the UK and Canada (Feb 2026) and Russia.</div><div>Entry rules change often and can depend on purpose of travel, residence permits and passport type. This page covers ordinary passports for short tourist visits. Confirm with the destination's official source or your airline before travelling. Reviewed October 2026.</div><div>Map: Natural Earth via world-atlas. Small states are drawn as dots.</div>`;

function renderAll(){$('#modeOut').setAttribute('aria-pressed',mode==='out');$('#modeIn').setAttribute('aria-pressed',mode==='in');pin.value=`${flag(sel)}  ${name(sel)}`;renderHeader();paintMap();renderLegend();renderBreakdown();renderList();renderEntry()}
renderAll();
})();
</script>
